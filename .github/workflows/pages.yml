name: Deploy Pages
# Triggered on push to main (lifehouse2/site) or manually via Run workflow
on:
  push:
    branches: [main]
    paths: ['lifehouse2/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lifehouse2/site
      - id: deployment
        uses: actions/deploy-pages@v4
