<title>Amorn's Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Manrope:wght@500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed warm isometric dollhouse on a floating lot. Sky + light follow the viewer's clock. All project data lives on the in-house TV (full-screen overlay). Single committed light look. */
:root{
  --bg:#f3e9da; --panel:rgba(255,251,244,.93); --solid:#fffdf8; --ink:#2e2638; --muted:#7d7385; --line:#eadfce;
  --accent:#c9553b; --accent-soft:#fbe8df; --gold:#f0b429;
  --good:#1f8a5b; --good-bg:#def3e8; --warn:#8f5605; --warn-bg:#fdefd0; --blue:#2f63b8; --blue-bg:#e6edfb; --idle:#6a6478; --idle-bg:#eeeaf3;
  --f-ui:'Manrope','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --shadow:0 10px 30px rgba(70,40,20,.16),0 1px 2px rgba(70,40,20,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased;touch-action:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:relative;height:100%;width:100%;overflow:hidden}
.sky{position:absolute;inset:0;background:linear-gradient(#7ec3f2,#e4f3fb);overflow:hidden}
.stars{position:absolute;inset:0;opacity:0;background-image:radial-gradient(1.4px 1.4px at 8% 12%,#fff,transparent),radial-gradient(1px 1px at 22% 30%,#fff,transparent),radial-gradient(1.6px 1.6px at 37% 8%,#fff,transparent),radial-gradient(1px 1px at 51% 22%,#fff,transparent),radial-gradient(1.4px 1.4px at 66% 11%,#fff,transparent),radial-gradient(1px 1px at 78% 28%,#fff,transparent),radial-gradient(1.6px 1.6px at 90% 9%,#fff,transparent),radial-gradient(1px 1px at 14% 44%,#fff,transparent),radial-gradient(1px 1px at 58% 41%,#fff,transparent),radial-gradient(1.2px 1.2px at 96% 38%,#fff,transparent)}
.orb{position:absolute;width:54px;height:54px;border-radius:50%;left:20%;top:12%;transition:background .6s;box-shadow:0 0 50px 14px var(--glow,rgba(255,230,150,.6))}
.cloud{position:absolute;height:22px;border-radius:22px;background:#fff;opacity:.8;filter:blur(.5px);animation:drift 120s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:34px;height:34px;left:14px;top:-17px}.cloud::after{width:26px;height:26px;left:44px;top:-10px}
.c1{width:90px;top:10%;left:-120px;animation-delay:-20s}.c2{width:70px;top:19%;left:-120px;animation-delay:-70s;animation-duration:150s}.c3{width:110px;top:6%;left:-120px;animation-delay:-105s;animation-duration:180s}
@keyframes drift{to{transform:translateX(calc(100vw + 260px))}}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#gl.drag{cursor:grabbing}#gl.hov{cursor:pointer}
.glass{background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.85);border-radius:16px;box-shadow:var(--shadow)}
.cap{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}

.top{position:absolute;left:16px;right:16px;top:12px;height:50px;display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;z-index:20}
.logo{display:flex;align-items:center;gap:9px;white-space:nowrap;font-weight:800;font-size:16px;letter-spacing:-.02em}
.logo .mk{width:30px;height:30px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:16px}
.logo small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:0;line-height:1}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;font-weight:700;font-size:12.5px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.btn:hover{background:var(--accent-soft)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.pri:hover{background:#b24a32}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.dark:hover{background:#463a56}
.btn.danger{color:#b8302f}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.clock{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:12.5px}
.clock:hover{background:var(--accent-soft)}
.clock b{font-family:var(--f-mono);font-weight:500;font-size:13px}
.clock small{color:var(--muted);font-weight:600}
.timebar{position:absolute;right:16px;top:70px;z-index:20;padding:10px 12px;display:none;align-items:center;gap:10px;width:300px}
.timebar.on{display:flex}
.timebar input{flex:1;accent-color:var(--accent)}
.timebar span{font-family:var(--f-mono);font-size:12px;min-width:42px}

.chips{position:absolute;left:16px;top:72px;display:flex;gap:4px;z-index:10;padding:5px;max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:10px;font-weight:700;font-size:12px;white-space:nowrap;color:#4a4256}
.chip i{width:9px;height:9px;border-radius:3px;background:var(--c,var(--ink))}
.chip:hover{background:var(--accent-soft)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}

.legend{position:absolute;left:16px;bottom:16px;padding:12px 14px;z-index:10;display:grid;grid-template-columns:auto auto;gap:6px 18px;font-size:11.5px}
.legend .cap{grid-column:1/-1}
.legend span{display:flex;align-items:center;gap:7px;color:#4a4256}
.legend svg{width:16px;height:16px}
.zoom{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;padding:4px;gap:2px;z-index:10;border-radius:12px}
.zoom button{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:17px;color:#3a3246}
.zoom button:hover{background:var(--accent-soft)}

.card{position:absolute;left:50%;bottom:18px;transform:translate(-50%,16px);width:min(440px,calc(100% - 24px));padding:14px 16px;z-index:30;opacity:0;pointer-events:none;transition:.28s}
.card.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.card h3{margin:2px 0 0;font-size:18px;letter-spacing:-.02em;line-height:1.25}
.card .row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.card .x{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted);font-size:16px}
.card .x:hover{background:var(--accent-soft)}
.card .next{margin-top:10px;font-size:12.5px;color:#4a4256;background:#f7f0e6;border-radius:10px;padding:8px 10px}
.card .next b{font-weight:700}
.card .acts{display:flex;gap:8px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.blue{background:var(--blue-bg);color:var(--blue)}.pill.idle{background:var(--idle-bg);color:var(--idle)}
.bar{height:7px;border-radius:7px;background:#eadfce;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:7px;background:var(--c,var(--accent));transition:width .4s}

.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.lab{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.bLab{display:flex;align-items:center;gap:6px;background:var(--solid);border-radius:8px;padding:3px 8px 3px 6px;box-shadow:0 3px 10px rgba(70,40,20,.18);font-size:11px;font-weight:700;border:1px solid var(--line);pointer-events:auto;cursor:pointer}
.bLab i{width:8px;height:8px;border-radius:3px;background:var(--c)}
.bLab small{color:var(--muted);font-weight:700;font-family:var(--f-mono)}
.bLab.sel{background:var(--ink);color:#fff;border-color:var(--ink)}.bLab.sel small{color:#e6dcf3}
.bLab.dim{opacity:.35}
.dLab{font-weight:800;font-size:12px;letter-spacing:.02em;padding:4px 10px;border-radius:8px;color:#fff;background:var(--c);box-shadow:0 3px 10px rgba(70,40,20,.22);pointer-events:auto;cursor:pointer}
.amLab{font-size:11px;font-weight:700;background:var(--ink);color:#fff;padding:3px 9px;border-radius:999px;box-shadow:0 3px 10px rgba(40,20,10,.3);display:flex;gap:6px;align-items:center;max-width:230px}
.amLab span{overflow:hidden;text-overflow:ellipsis}
.amLab i{width:7px;height:7px;border-radius:50%;background:#7be0a6;flex:none}
.toast{position:absolute;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:calc(100% - 32px);font-size:12px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hint{position:absolute;left:50%;top:128px;transform:translateX(-50%);z-index:9;padding:8px 14px;font-size:12px;font-weight:600;color:#4a4256;opacity:0;pointer-events:none;transition:.5s;white-space:nowrap}
.hint.on{opacity:1}

/* ---------- TV ---------- */
.tv{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:3.5vh 3.5vw;background:rgba(26,16,10,0);transition:background .4s}
.tv.on{display:flex}.tv.show{background:rgba(26,16,10,.45)}
.bezel{width:100%;height:100%;max-width:1320px;background:#15161d;border-radius:28px;padding:14px;box-shadow:0 30px 80px rgba(20,10,5,.55),inset 0 0 0 2px #2c2e3b;transform:scale(.62);opacity:0;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .35s;position:relative}
.tv.show .bezel{transform:none;opacity:1}
.bezel::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;border-radius:50%;background:#3d4052;transform:translateX(-50%)}
.screen{--tv:#10131c;--tv2:#1a1e2c;--tv3:#242938;--tl:#2e3448;--ti:#eeebf6;--tm:#a09db4;--ta:#f0a23c;
  height:100%;border-radius:16px;background:var(--tv);color:var(--ti);display:grid;grid-template-columns:196px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.tvTop{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--tl);background:linear-gradient(#171b29,#10131c)}
.tvTop .ttl{font-weight:800;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.tvTop .ttl i{width:9px;height:9px;border-radius:50%;background:#ff5d5d;box-shadow:0 0 10px #ff5d5d}
.tvTop .tt{font-family:var(--f-mono);font-size:12px;color:var(--tm)}
.tvTop .sp{flex:1}
.tvb{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:9px;background:var(--tv3);color:var(--ti);font-weight:700;font-size:12px;border:1px solid var(--tl);white-space:nowrap}
.tvb:hover{background:#2f3550}
.tvb.pri{background:var(--ta);color:#241504;border-color:var(--ta)}.tvb.pri:hover{background:#ffb455}
.tvb.danger{color:#ff8e8e}
.tvb.sm{height:28px;padding:0 9px;font-size:11.5px}
.tvNav{display:flex;flex-direction:column;gap:4px;padding:12px 10px;border-right:1px solid var(--tl);background:#0d1018;overflow:auto}
.tvNav button{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:11px;color:var(--tm);font-weight:700;font-size:13px;text-align:left}
.tvNav button small{margin-left:auto;font-family:var(--f-mono);font-weight:500;font-size:11px;opacity:.85}
.tvNav button:hover{background:var(--tv2);color:var(--ti)}
.tvNav button[aria-selected=true]{background:var(--ta);color:#241504}
.tvMain{overflow:auto;padding:18px 22px 28px;min-width:0;scrollbar-width:thin;scrollbar-color:#3a4058 transparent;touch-action:pan-y}
.tvMain h2{margin:0;font-size:22px;letter-spacing:-.02em;line-height:1.25}
.tvMain .sub{color:var(--tm);margin:4px 0 0;font-size:12.5px}
.tvMain .cap{color:var(--tm)}

.board{background:#22382f;border:8px solid #b98a5c;border-radius:12px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.2);padding:14px 16px 16px;color:#eef3ea;--qfg:#eef3ea;--qdim:#8fa59a;margin-top:14px}
.bHead{display:flex;align-items:baseline;gap:8px}
.bHead b{font-size:16px;letter-spacing:.16em;text-transform:uppercase}
.bHead span{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--qdim)}
.bBar{height:5px;border-radius:5px;background:rgba(255,255,255,.14);margin:8px 0 12px;overflow:hidden}
.bBar i{display:block;height:100%;background:#eef3ea;border-radius:5px;transition:width .4s}
.qAdd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;margin-bottom:8px}
.qAdd select,.qAdd input{height:34px;border-radius:8px;border:1px dashed rgba(238,243,234,.45);background:rgba(255,255,255,.06);color:#eef3ea;padding:0 10px;font-size:13px;min-width:0}
.qAdd select{font-weight:600}.qAdd select option{color:#2e2638}
.qAdd input::placeholder{color:#8fa59a}
.qAdd button{height:34px;padding:0 14px;border-radius:8px;background:#eef3ea;color:#22382f;font-weight:800;font-size:12.5px}
.qCols{columns:2 300px;column-gap:26px}
.qGroup{margin-top:12px;break-inside:avoid}
.qG{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12.5px;color:var(--c);letter-spacing:.02em;filter:brightness(1.35) saturate(.9)}
.qG i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.qG small{margin-left:auto;color:var(--qdim);font-family:var(--f-mono);font-weight:500;filter:none}
.none{color:var(--qdim);font-size:12px;padding:4px 0 0 16px}
.q{display:flex;align-items:flex-start;gap:9px;padding:6px 0 6px 2px;cursor:pointer;position:relative}
.q input{position:absolute;opacity:0;pointer-events:none}
.q .ck{width:17px;height:17px;border:2px solid var(--qfg);border-radius:4px;margin-top:2px;flex:none;display:grid;place-items:center;transition:background .2s}
.q .ck::after{content:"";width:8px;height:4px;border-left:2px solid #22382f;border-bottom:2px solid #22382f;transform:rotate(-45deg) scale(0);margin-top:-2px;transition:transform .2s}
.q.done .ck{background:var(--qfg)}.q.done .ck::after{transform:rotate(-45deg) scale(1)}
.q .tx{flex:0 1 auto;min-width:0;font-size:13.5px;line-height:1.5;font-weight:500;color:var(--qfg);padding-bottom:1px;background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0% 2px;transition:background-size .4s ease,color .3s}
.q.done .tx{background-size:100% 2px;color:var(--qdim)}
.q .qx{opacity:0;color:var(--qdim);font-size:17px;line-height:1;padding:0 6px;margin-top:1px;margin-left:auto}
.q:hover .qx,.q:focus-within .qx{opacity:1}
.q input:focus-visible+.ck{outline:2px solid #eef3ea;outline-offset:2px}
.onTv{--qfg:var(--ti);--qdim:var(--tm)}
.onTv .q .ck::after{border-color:var(--tv)}

.tvc{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:var(--tv2);border:1px solid var(--tl);color:inherit}
button.tvc:hover{border-color:var(--c,var(--ta));background:#212638}
.tvc .r{display:flex;align-items:center;gap:9px}
.tvc .sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
.tvc b{font-size:13.5px}.tvc small{color:var(--tm);margin-left:auto;font-size:11.5px}
.tvc .bar{background:#2c3248;margin-top:9px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.grp{margin-top:20px}
.grp>.cap{display:flex;align-items:center;gap:8px;color:var(--c)}
.grp>.cap i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.kp div{background:var(--tv2);border:1px solid var(--tl);border-radius:14px;padding:12px 14px}
.kp .kl{font-size:11.5px;color:var(--tm);font-weight:600}
.kp b{display:block;font-size:26px;letter-spacing:-.03em;line-height:1.2}
.kp small{color:var(--tm);font-size:11px}
.pill.tvp{background:var(--tv3);color:var(--ti)}
.pill.tvp.good{background:#143a2c;color:#7be0a6}.pill.tvp.warn{background:#3d2d0b;color:#ffcf6a}.pill.tvp.blue{background:#162a4d;color:#8db4ff}.pill.tvp.idle{background:#2b2a38;color:#b6b2c8}
.frm{display:flex;flex-direction:column;gap:12px;margin-top:14px;max-width:460px}
.frm label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:700;color:var(--tm)}
.frm input[type=text],.frm input[type=number],.frm select{height:38px;border:1px solid var(--tl);background:var(--tv2);border-radius:10px;padding:0 11px;font-size:13.5px;font-weight:500;color:var(--ti);width:100%}
.frm select option{color:#2e2638}
.frm input[type=range]{width:100%;accent-color:var(--ta)}
.frm .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--tm);font-weight:700;font-size:12px;margin-bottom:10px}
.back:hover{color:var(--ti)}
.big{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:14px}
.big small{font-size:15px;color:var(--tm);font-weight:700;letter-spacing:0}

/* weekly routines */
.rt{margin-top:16px;background:var(--tv2);border:1px solid var(--tl);border-radius:16px;padding:14px 16px;--c:var(--ta)}
.rt .h{display:flex;align-items:center;gap:10px}
.rt .h b{font-size:15px}.rt .h .pc{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;color:var(--tm)}
.rt .bar{background:#2c3248;margin:10px 0 6px;flex:none}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:10px}
.dy{background:var(--tv);border:1px solid var(--tl);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:7px;min-width:0}
.dy.today{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.dy .dn{font-size:11px;font-weight:800;color:var(--tm);display:flex;justify-content:space-between}
.dy.today .dn{color:var(--c)}
.dy input[type=text]{height:30px;border:1px dashed var(--tl);background:transparent;border-radius:8px;padding:0 7px;font-size:12px;color:var(--ti);width:100%;min-width:0}
.dy input[type=text]:focus{border-style:solid;border-color:var(--c);outline:none}
.dy .tg{height:30px;border-radius:8px;background:var(--tv3);color:var(--tm);font-size:11.5px;font-weight:800;display:grid;place-items:center;border:1px solid var(--tl)}
.dy .tg.done{background:var(--c);color:#241504;border-color:var(--c)}
.dy .tg[disabled]{opacity:.35;cursor:default}
.tro{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:10px}
.tro div{background:var(--tv2);border:1px solid var(--tl);border-radius:14px;padding:14px;text-align:center}
.tro div.off{opacity:.45}
.tro svg{width:46px;height:46px;margin:0 auto 6px;display:block}
.tro b{display:block;font-size:13px}.tro small{color:var(--tm);font-size:11.5px}

@media (max-width:900px){
  .legend{display:none}
  .top{left:8px;right:8px;top:8px;height:46px;padding:0 8px 0 10px;gap:6px}
  .logo small{display:none}.logo span.nm{display:none}
  .btn .t,.clock small{display:none}
  .chips{top:62px;left:8px;right:8px;max-width:none}
  .zoom{right:8px;top:auto;bottom:auto;top:116px;transform:none}
  .timebar{right:8px;left:8px;width:auto;top:62px}
  .card{bottom:10px}
  .hint{top:116px;white-space:normal;width:max-content;max-width:calc(100% - 100px)}

function mergeStatic(root){
  root.updateMatrixWorld(true);
  var inv=new T.Matrix4().copy(root.matrixWorld).invert(),buckets={},list=[];
  root.traverse(function(o){
    if(o.isMesh&&!o.userData.keep&&o.geometry&&!Array.isArray(o.material)&&o.material.visible!==false){
      var key=o.material.uuid+(o.castShadow?'c':'')+(o.receiveShadow?'r':'');
      (buckets[key]=buckets[key]||{m:o.material,c:o.castShadow,r:o.receiveShadow,l:[]}).l.push(o);list.push(o);
    }
  });
  Object.keys(buckets).forEach(function(k){
    var b=buckets[k],pos=[],nor=[],idx=[],off=0;
    b.l.forEach(function(o){
      var g=o.geometry.clone();g.applyMatrix4(new T.Matrix4().multiplyMatrices(inv,o.matrixWorld));
      var p=g.attributes.position.array,n=g.attributes.normal.array;
      for(var i=0;i<p.length;i++){pos.push(p[i]);nor.push(n[i])}
      var ix=g.index?g.index.array:null;
      if(ix){for(var j=0;j<ix.length;j++)idx.push(ix[j]+off)}else{for(var j2=0;j2<p.length/3;j2++)idx.push(j2+off)}
      off+=p.length/3;g.dispose();
    });
    var geo=new T.BufferGeometry();
    geo.setAttribute('position',new T.Float32BufferAttribute(pos,3));geo.setAttribute('normal',new T.Float32BufferAttribute(nor,3));
    geo.setIndex(off>65000?new T.Uint32BufferAttribute(idx,1):new T.Uint16BufferAttribute(idx,1));
    var m=new T.Mesh(geo,b.m);m.castShadow=b.c;m.receiveShadow=b.r;root.add(m);
  });
  list.forEach(function(o){if(o.parent)o.parent.remove(o)});
}

function applyTime(){
  var h=curH(),i=0;for(i=0;i<KF.length-2&&h>KF[i+1].h;i++){}
  var a=KF[i],b=KF[i+1],t=clamp((h-a.h)/(b.h-a.h),0,1);
  tmpA.copy(a.top).lerp(b.top,t);var top='#'+tmpA.getHexString();tmpB.copy(a.bot).lerp(b.bot,t);var bot='#'+tmpB.getHexString();
  $('#sky').style.background='linear-gradient('+top+','+bot+')';

  hemi.color.copy(a.hs).lerp(b.hs,t);hemi.groundColor.copy(a.hg).lerp(b.hg,t);hemi.intensity=lerp(a.hi,b.hi,t);
  sun.color.copy(a.sun).lerp(b.sun,t);sun.intensity=lerp(a.si,b.si,t);
  /* sun / moon position */
  var dayT=(h-6)/12,isDay=dayT>=0&&dayT<=1,ang=isDay?dayT*PI:((h>=18?h-18:h+6)/12)*PI;
  var sx=Math.cos(ang)*60,sy=Math.max(14,Math.sin(ang)*80);
  sun.userData.dir=[sx,sy,30];
  var orb=$('#orb'),px=8+(isDay?dayT:(((h>=18?h-18:h+6)/12)))*84,py=24-Math.sin(ang)*18;
  orb.style.left=px+'%';orb.style.top=py+'%';
  if(isDay){var warmK=1-Math.sin(ang);orb.style.background='radial-gradient(circle at 40% 40%,#fffbe0,#ffd25a '+(60+warmK*10)+'%,#ff9a3c)';orb.style.setProperty('--glow','rgba(255,'+(220-warmK*80|0)+','+(130-warmK*60|0)+',.6)')}
  else{orb.style.background='radial-gradient(circle at 36% 38%,#fff,#dfe6ff 62%,#a9b6e6)';orb.style.setProperty('--glow','rgba(170,190,255,.35)')}
  orb.style.width=orb.style.height=(isDay?54:40)+'px';
  $('#stars').style.opacity=clamp((nf-.3)/.7,0,1);
  document.querySelectorAll('.cloud').forEach(function(c){c.style.opacity=lerp(.85,.18,nf)});
  /* windows / lamps */
  tmpA.copy(a.bot).lerp(b.bot,t).lerp(warm,clamp(nf*1.2,0,1));
  winMat.color.copy(tmpA);winMat.emissive.copy(tmpA);winMat.emissiveIntensity=.4+.55*nf;
  lampMat.emissiveIntensity=.12+.95*nf;lanternMat.emissiveIntensity=.1+1.1*nf;
  glowDecals.forEach(function(g){g.material.opacity=nf*.6});
  /* clock + labels in HTML */
  var hh=Math.floor(h),mm=Math.floor((h-hh)*60);
  $('#clkT').textContent=(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
  $('#clkP').textContent=h<5||h>=19.6?'กลางคืน':h<7.8?'เช้าตรู่':h<11.5?'เช้า':h<15.5?'บ่าย':h<18?'เย็น':'ค่ำ';
  var night=nf>.55;$('#clkIco').innerHTML=night?'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/>':'<circle cx="12" cy="12" r="4.2"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/>';
  if(clockHands){clockHands.hr.rotation.z=-((h%12)/12)*PI*2;clockHands.mn.rotation.z=-((h%1))*PI*2}

/* build one straight wall run with openings; axis 'x' => along x at fixed z; 'z' => along z at fixed x */

  var segs=[],cur=a0;gaps=(gaps||[]).slice().sort(function(p,q){return p[0]-q[0]});
  gaps.forEach(function(gp){if(gp[0]>cur)segs.push([cur,gp[0]]);cur=gp[1]});if(cur<a1)segs.push([cur,a1]);
  function put(s0,s1,y0,y1){var L=s1-s0,hh=y1-y0,c=(s0+s1)/2;if(axis==='x')box(L,hh,t,col,c,y0+hh/2,fixed,g);else box(t,hh,L,col,fixed,y0+hh/2,c,g)}
  segs.forEach(function(s){put(s[0],s[1],0,h)});

}

function refreshSel(){
  renderChips();

  items.forEach(function(i){var on=i.id===st.sel;i.el.classList.toggle('sel',on);i.el.classList.toggle('dim',st.filter!=='all'&&i.r.k!==st.filter&&!on);
    i.el.querySelector('small').textContent=i.kind==='p'?prog(i.p)+'%':rstat(i.rt).done+'/'+rstat(i.rt).planned;i.el.querySelector('span').textContent=i.kind==='p'?i.p.name:i.rt.name});

$('#card').addEventListener('click',function(e){
  var a=e.target.closest('[data-a]');if(!a)return;var k=a.dataset.a,it=st.sel?itemById(st.sel):null;
  if(k==='close'){st.sel=null;refreshSel()}

function openTV(tab,projId){
  if(tab)tv.tab=tab;tv.form=null;if(projId){tv.proj=projId}else if(tab==='projects'&&!projId){tv.proj=null}
  if(!tv.open){tv.open=true;saveCam={gx:cs.gx,gz:cs.gz,gzoom:cs.gzoom,gaz:cs.gaz};
    if(!roofOpen)setRoof(true);
    cs.gx=11;cs.gz=1.4;cs.gzoom=3.6;cs.gaz=Math.round(cs.gaz/360)*360+45;st.sel=null;refreshSel();
    var show=function(){var el=$('#tv');renderTV();el.classList.add('on');el.setAttribute('aria-hidden','false');requestAnimationFrame(function(){requestAnimationFrame(function(){el.classList.add('show');var b=$('#tvX');if(b)b.focus({preventScroll:true})})})};
    if(reduced)show();else setTimeout(show,720);
  }else renderTV();
}
function closeTV(){
  if(!tv.open)return;tv.open=false;var el=$('#tv');el.classList.remove('show');el.setAttribute('aria-hidden','true');
  setTimeout(function(){el.classList.remove('on')},reduced?0:420);
  if(saveCam){cs.gx=saveCam.gx;cs.gz=saveCam.gz;cs.gzoom=saveCam.gzoom;cs.gaz=saveCam.gaz}
}
function afterData(delay){setTimeout(function(){rebuild();if(tv.open)renderTV()},reduced?0:delay||0)}
var tvEl=$('#tv');
tvEl.addEventListener('click',function(e){
  if(e.target===tvEl){closeTV();return}
  var n=e.target.closest('[data-nav]');if(n){tv.tab=n.dataset.nav;tv.form=null;if(tv.tab!=='projects')tv.proj=null;renderTV();return}
  var del=e.target.closest('[data-del]');
  if(del){e.preventDefault();e.stopPropagation();var ids=del.dataset.del.split('|'),p=proj(ids[0]);if(p){p.tasks=p.tasks.filter(function(t){return t.id!==ids[1]});save();afterData(0)}return}
  var op=e.target.closest('[data-open]');if(op){tv.proj=op.dataset.open;renderTV();return}
  var rm=e.target.closest('[data-room]');if(rm){var k=rm.dataset.room;if(room(k).routine){tv.tab='week'}else{tv.tab='quests';tv.qf=k}renderTV();return}
  var dy=e.target.closest('[data-day]');
  if(dy){var a=dy.dataset.day.split('|'),rt=rout(a[0]),d=rt&&rt.days[+a[1]];if(d&&d.plan&&d.plan.trim()){d.done=!d.done;save();if(d.done){toast('บันทึกแล้ว '+rt.name+' '+DAYS[+a[1]]);var it=itemById('r:'+rt.id);S.last='r:'+rt.id;if(it)sendAmorn(it)}afterData(0)}return}
  var b=e.target.closest('[data-a]');if(!b)return;var k2=b.dataset.a;
  if(k2==='tvclose')closeTV();
  else if(k2==='back'){tv.proj=null;renderTV()}
  else if(k2==='edit'){tv.form='edit';renderTV()}
  else if(k2==='newproj'){tv.form='new';tv.newRoom='work';renderTV()}
  else if(k2==='cancel'){tv.form=null;renderTV()}
  else if(k2==='qf'){tv.qf=b.dataset.v;renderTV()}
  else if(k2==='gonow'){var it2=itemById(b.dataset.v);if(it2){S.last=it2.id;sendAmorn(it2);toast('Amorn กำลังเดินไปทำโปรเจกต์นี้')}}
  else if(k2==='delproj'){S.projects=S.projects.filter(function(x){return x.id!==tv.proj});tv.proj=null;tv.form=null;save();afterData(0);toast('ลบแล้ว')}
  else if(k2==='copy'){var txt=JSON.stringify(S,null,1);try{navigator.clipboard.writeText(txt).then(function(){toast('คัดลอก JSON แล้ว')},function(){toast('เบราว์เซอร์ไม่อนุญาตให้คัดลอก')})}catch(err){toast('เบราว์เซอร์ไม่อนุญาตให้คัดลอก')}}
  else if(k2==='reset'){S=freshState();save();tv.proj=null;tv.form=null;tv.qf='all';afterData(0);toast('รีเซ็ตเป็นข้อมูลตัวอย่างแล้ว')}
});
tvEl.addEventListener('change',function(e){
  var c=e.target.closest('[data-t]');
  if(c){var ids=c.dataset.t.split('|'),p=proj(ids[0]);if(!p)return;var t=p.tasks.filter(function(x){return x.id===ids[1]})[0];if(!t)return;
    t.done=c.checked;c.closest('.q').classList.toggle('done',t.done);
    var all=p.tasks.every(function(x){return x.done});
    if(all&&p.status!=='done'){p.status='done';toast('โปรเจกต์สำเร็จ ได้ถ้วยรางวัลแล้ว: '+p.name)}
    else if(!all&&p.status==='done'){p.status='active'}
    else if(t.done)toast('เควสสำเร็จ');
    if(t.done){S.last=p.id;var it=itemById(p.id);if(it)sendAmorn(it)}
    save();afterData(420);return}
  var pl=e.target.closest('[data-plan]');
  if(pl){var a=pl.dataset.plan.split('|'),rt=rout(a[0]),d=rt&&rt.days[+a[1]];if(d){d.plan=pl.value.trim();if(!d.plan)d.done=false;save();afterData(0)}}
});
tvEl.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='qAdd'){var txt=$('#qText').value.trim(),pid=$('#qProj').value,p=proj(pid);if(!txt||!p)return;
    p.tasks=p.tasks||[];p.tasks.push(Q(txt));if(p.status==='done')p.status='active';tv.pick=pid;save();afterData(0);toast('เพิ่มเควสแล้ว');return}
  if(e.target.id==='frm'){
    var name=$('#fName').value.trim();if(!name)return;
    var vals={name:name,dist:$('#fDist').value,status:$('#fStatus').value,hrs:Math.max(0,+$('#fHrs').value||0)};
    var pe=$('#fProg');if(pe)vals.prog=+pe.value;
    var p2=tv.form==='edit'?proj(tv.proj):null;
    if(p2){Object.assign(p2,vals)}else{if(S.projects.filter(function(x){return x.dist===vals.dist}).length>=6){toast('ห้องนี้เต็มแล้ว (สูงสุด 6 โปรเจกต์)');return}p2=Object.assign({id:'p'+Date.now(),tasks:[],prog:vals.prog||0},vals);S.projects.push(p2);tv.proj=p2.id}
    if(p2.status==='done'&&!(p2.tasks||[]).length)p2.prog=100;
    save();tv.form=null;afterData(0);toast('บันทึกแล้ว')}
});
tvEl.addEventListener('input',function(e){if(e.target.id==='fProg')$('#fProgV').textContent=e.target.value+'%'});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(tv.open)closeTV();else if(st.sel){st.sel=null;refreshSel()}}});

/* ================= top buttons ================= */
function setRoof(open){
  roofOpen=open;$('#bRoof').setAttribute('aria-pressed',open);$('#roofT').textContent=open?'ปิดหลังคา':'เปิดหลังคา';
  if(!open){st.sel=null;refreshSel()}
  showHint(open?'คลิกของในบ้านเพื่อดูโปรเจกต์ หรือคลิกทีวีเพื่อเปิดแดชบอร์ด':'คลิกบ้านหรือกด “เปิดหลังคา” เพื่อดูห้องข้างใน');
}
var hintT;function showHint(m){var h=$('#hint');h.textContent=m;h.classList.add('on');clearTimeout(hintT);hintT=setTimeout(function(){h.classList.remove('on')},4200)}
$('#bRoof').onclick=function(){setRoof(!roofOpen)};
$('#bTv').onclick=function(){openTV()};
$('#bClock').onclick=function(){var tb=$('#timebar');tb.classList.toggle('on');if(tb.classList.contains('on')){$('#tbR').value=curH();$('#tbL').textContent=$('#clkT').textContent}};
$('#tbR').addEventListener('input',function(e){tOver=+e.target.value;applyTime();$('#tbL').textContent=$('#clkT').textContent});

/* ================= camera ================= */
var cs={x:5,z:10,gx:5,gz:10,zoom:.86,gzoom:.86,az:45,gaz:45},EL=33*PI/180;
function updCam(dt){
  var k=1-Math.exp(-8*dt);cs.x+=(cs.gx-cs.x)*k;cs.z+=(cs.gz-cs.z)*k;cs.zoom+=(cs.gzoom-cs.zoom)*k;cs.az+=(cs.gaz-cs.az)*k;
  var a=cs.az*PI/180,D=400;
  cam.position.set(cs.x+Math.sin(a)*Math.cos(EL)*D,Math.sin(EL)*D,cs.z+Math.cos(a)*Math.cos(EL)*D);cam.lookAt(cs.x,0,cs.z);
  var W=window.innerWidth,Hh=window.innerHeight,asp=W/Hh,vh=45/cs.zoom,vw=vh*asp;
  if(vw<58/cs.zoom){vw=58/cs.zoom;vh=vw/asp}
  cam.left=-vw/2;cam.right=vw/2;cam.top=vh/2;cam.bottom=-vh/2;cam.updateProjectionMatrix();
  var ss=clamp(70/Math.max(cs.zoom,1),30,72);sc.left=-ss;sc.right=ss;sc.top=ss;sc.bottom=-ss;sc.updateProjectionMatrix();
  var d=sun.userData.dir||[40,70,30];sun.position.set(cs.x+d[0],d[1],cs.z+d[2]);sun.target.position.set(cs.x,0,cs.z);
}
function resize(){renderer.setSize(window.innerWidth,window.innerHeight,false)}
window.addEventListener('resize',resize);resize();
function flyHome(){cs.gx=5;cs.gz=10;cs.gzoom=window.innerWidth<900?1.0:.86;st.filter='all'}
function flyRoom(k){var r=room(k);st.filter=k;st.sel=null;cs.gx=r.cx;cs.gz=r.cz;cs.gzoom=r.k==='pool'?1.6:r.k==='garden'?1.1:2.0;if(!r.outdoor&&!roofOpen)setRoof(true)}
function select(id,fly){
  if(id==='__tv'){openTV();return}
  if(id==='__trophy'){openTV('trophies');return}
  if(id==='__amorn'){toast('Amorn · '+amorn.text);return}
  if(id==='__dog'){toast('บอร์เดอร์คอลลี่ · โฮ่ง!');dog.followT=.01;return}
  var it=itemById(id);if(!it)return;
  if(!it.r.outdoor&&!roofOpen)setRoof(true);
  st.sel=id;st.filter=it.r.k;S.last=id;save();sendAmorn(it);
  if(fly){cs.gx=it.x;cs.gz=it.z;cs.gzoom=Math.max(cs.gzoom,2.3)}
  refreshSel();
}
flyHome();cs.x=cs.gx;cs.z=cs.gz;cs.zoom=cs.gzoom;

var ptrs={},drag=null,pinch=0;
canvas.addEventListener('pointerdown',function(e){canvas.setPointerCapture(e.pointerId);ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  if(Object.keys(ptrs).length===1){drag={moved:0};canvas.classList.add('drag')}
  if(Object.keys(ptrs).length===2){var p=Object.values(ptrs);pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);drag=null}});
canvas.addEventListener('pointermove',function(e){
  if(!ptrs[e.pointerId]){hoverAt(e.clientX,e.clientY);return}
  var prev=ptrs[e.pointerId];ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  if(Object.keys(ptrs).length===2){var p=Object.values(ptrs),dd=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinch)cs.gzoom=clamp(cs.gzoom*dd/pinch,.5,4);pinch=dd;return}
  if(!drag)return;
  var dx=e.clientX-prev.x,dy=e.clientY-prev.y;drag.moved+=Math.abs(dx)+Math.abs(dy);
  var s=(cam.top-cam.bottom)/window.innerHeight,a=cs.az*PI/180;
  cs.gx-=Math.cos(a)*dx*s;cs.gz+=Math.sin(a)*dx*s;cs.gx+=-Math.sin(a)*dy*s/Math.sin(EL);cs.gz+=-Math.cos(a)*dy*s/Math.sin(EL);
  cs.gx=clamp(cs.gx,-40,50);cs.gz=clamp(cs.gz,-26,42)});
var rc=new T.Raycaster(),v2=new T.Vector2();
function pickAt(px,py){v2.set(px/window.innerWidth*2-1,-(py/window.innerHeight)*2+1);rc.setFromCamera(v2,cam);
  var hits=rc.intersectObjects(pickables,true);for(var i=0;i<hits.length;i++){var o=hits[i].object;while(o){if(o.userData&&o.userData.sel)return o.userData.sel;o=o.parent}}return null}
function hitHouse(px,py){v2.set(px/window.innerWidth*2-1,-(py/window.innerHeight)*2+1);rc.setFromCamera(v2,cam);
  var tg=[roof];Object.keys(extWalls).forEach(function(k){tg.push(extWalls[k])});return rc.intersectObjects(tg,true).length>0}
function isIndoor(id){if(id==='__tv'||id==='__trophy'||id==='__amorn'&&nodeAt(amorn.x,amorn.z)!=='garden'&&nodeAt(amorn.x,amorn.z)!=='pool'||id==='__dog'&&nodeAt(dog.x,dog.z)!=='garden'&&nodeAt(dog.x,dog.z)!=='pool')return true;var it=itemById(id);return !!it&&!it.r.outdoor}
function endPtr(e){var was=drag;delete ptrs[e.pointerId];canvas.classList.remove('drag');if(Object.keys(ptrs).length<2)pinch=0;
  if(e.type==='pointerup'&&was&&was.moved<6){
    var id=pickAt(e.clientX,e.clientY);
    if(id&&!roofOpen&&isIndoor(id))id=null;
    if(id)select(id,true);
    else if(!roofOpen&&hitHouse(e.clientX,e.clientY))setRoof(true);
    else if(st.sel){st.sel=null;refreshSel()}
  }drag=null}
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',function(e){e.preventDefault();cs.gzoom=clamp(cs.gzoom*Math.exp(-e.deltaY*.0012),.5,4)},{passive:false});
var hovT=0;function hoverAt(x,y){var n=performance.now();if(n-hovT<80)return;hovT=n;var id=pickAt(x,y);if(id&&!roofOpen&&isIndoor(id))id=null;canvas.classList.toggle('hov',!!id||(!roofOpen&&hitHouse(x,y)))}
$('#zIn').onclick=function(){cs.gzoom=clamp(cs.gzoom*1.25,.5,4)};$('#zOut').onclick=function(){cs.gzoom=clamp(cs.gzoom/1.25,.5,4)};
$('#rL').onclick=function(){cs.gaz-=90};$('#rR').onclick=function(){cs.gaz+=90};
$('#zHome').onclick=function(){st.sel=null;flyHome();cs.gaz=Math.round(cs.gaz/360)*360+45;refreshSel()};

var vt=new T.Vector3();
function proj3(x,y,z){vt.set(x,y,z);vt.project(cam);return [(vt.x+1)/2*window.innerWidth,(1-vt.y)/2*window.innerHeight]}
function updLabels(){
  var inside=roofT>.85,thr=window.innerWidth>900?1.25:1.7,tvv=tv.open;
  ROOMS.forEach(function(r){var p=proj3(r.k==='pool'?r.cx:r.cx,.9,r.k==='pool'?r.z1-3.5:r.z1-1.4);r.el.style.transform='translate('+(p[0]|0)+'px,'+(p[1]|0)+'px) translate(-50%,-50%)';
    r.el.style.display=(!tvv&&cs.zoom<=2.7&&(window.innerWidth>900||cs.zoom>1.25)&&(r.outdoor||inside))?'block':'none'});
  items.forEach(function(it){var p=proj3(it.x,it.h+(it.r.k==='garden'?.8:.6)+(it.r.k==='pool'?-1.5:0)+(it.kind==='r'&&it.r.k==='pool'?0:0),it.z);it.el.style.transform='translate('+(p[0]|0)+'px,'+(p[1]|0)+'px) translate(-50%,-100%)';
    var vis=!tvv&&(it.r.outdoor||inside)&&(it.id===st.sel||(cs.zoom>thr&&(st.filter==='all'||it.r.k===st.filter)));it.el.style.display=vis?'flex':'none'});
  var am=$('#amLab'),ap=proj3(amorn.x,amorn.y+(amorn.mode==='sleep'?2.8:3.6),amorn.z),aIn=nodeAt(amorn.x,amorn.z),aOut=aIn==='garden'||aIn==='pool';
  am.style.transform='translate('+(ap[0]|0)+'px,'+(ap[1]|0)+'px) translate(-50%,-100%)';am.style.display=(!tvv&&(aOut||inside)&&cs.zoom>.7)?'flex':'none';
  var s=st.sel?itemById(st.sel):null;
  if(s){ring.visible=true;ring.position.set(s.x,baseY(s.r)+.15,s.z);var q=1+Math.sin(performance.now()/260)*.04;ring.scale.set(q,q,q)}else ring.visible=false;
}

/* ================= loop ================= */
var last=performance.now(),tmT=0,lastMin=-1;
var wallFacing=function(g){var a=cs.az*PI/180;return g.userData.nx*Math.sin(a)+g.userData.nz*Math.cos(a)>.25};
var roofShadow=true;
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  items.forEach(function(it){var g=it.g;if(g.scale.x<1){var t=clamp((clock-it.t0)/.5,0,1),e=1-Math.pow(1-t,3)+Math.sin(t*PI)*.12;g.scale.setScalar(Math.max(.001,t>=1?1:e))}});
  markers.forEach(function(m){m.o.position.y=m.base+Math.sin(clock*2+m.ph)*.15;if(m.st==='done'||m.st==='planning')m.o.rotation.y=clock*1.4;if(m.st==='active'){var s=1+.18*Math.sin(clock*3+m.ph);m.o.scale.setScalar(s)}});
  /* roof + walls */
  var rt=roofOpen?1:0;roofT+=clamp(rt-roofT,-1,1)*Math.min(1,dt*(reduced?60:2.6));if(Math.abs(rt-roofT)<.002)roofT=rt;
  var e=roofT*roofT*(3-2*roofT);roof.position.y=.5+EXTH+1.55+e*10;roof.visible=roofT<.995;
  var op=1-clamp((roofT-.12)/.6,0,1);roofMats.forEach(function(m){m.opacity=op});
  var sh=roofT<.2;if(sh!==roofShadow){roofShadow=sh;roof.traverse(function(o){if(o.isMesh)o.castShadow=sh})}
  Object.keys(extWalls).forEach(function(k){var g=extWalls[k],target=(roofOpen&&wallFacing(g))?.13:1;g.scale.y+=(target-g.scale.y)*Math.min(1,dt*7);g.userData.s=g.scale.y});
  /* time */
  tmT+=dt;if(tmT>(tOver===null?10:99)){tmT=0;if(tOver===null)applyTime()}
  if(tvTexNeeds){var mn=Math.floor(TM.h*60);if(mn!==lastMin){lastMin=mn;drawTV()}tvTexNeeds=0}
  poseAgents(dt);
  updCam(dt);updLabels();renderer.render(scene,cam);requestAnimationFrame(frame);
}
applyTime();
rebuild();refreshSel();
if(reduced){roofT=1;setRoof(true)}else{setTimeout(function(){if(!roofOpen)setRoof(true)},1700)}
sendAmorn(itemById(S.last)||items.filter(function(i){return i.kind==='p'&&i.p.status==='active'})[0]);
amorn.x=amorn.cur?amorn.cur.x:amorn.x;amorn.z=amorn.cur?amorn.cur.z:amorn.z;amorn.path=[];arrive(amorn);
window.__lh={renderer:renderer,trophyG:trophyG,scene:scene,st:st,tv:tv,get S(){return S},setTime:function(h){tOver=h;applyTime()},openTV:openTV,closeTV:closeTV,setRoof:setRoof,select:select,cs:cs,items:function(){return items},amorn:amorn,dog:dog,roofT:function(){return roofT}};
requestAnimationFrame(frame);
})();
